<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<title>மங்கை மலரகம் – உரிமையாளர் பக்கம்</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf5;--surface:#fff;--band:#fdeef0;--ink:#2b1119;--muted:#6b5459;--kumkum:#7a1233;--accent:#b01d52;--turmeric:#f0a900;--leaf:#2f6a3d;--line:#efd9d0;--ok:#1f7a3a;--bad:#b3261e;
 --f-ta:"Noto Serif Tamil","Latha","Nirmala UI",serif;--f-body:"Hind Madurai","Latha","Nirmala UI",system-ui,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1a0e12;--surface:#2a1620;--band:#2a1520;--ink:#fbeadf;--muted:#cdb4b6;--kumkum:#4d0c22;--accent:#c93a72;--turmeric:#f5b92a;--leaf:#7fc08a;--line:#4a2b36;--ok:#7fd69a;--bad:#ff9a90}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px;border-radius:6px}
.hd{background:var(--kumkum);color:#fff3ea;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd b{font-family:var(--f-ta);font-size:1.2rem}
.hd span{opacity:.85;flex:1}
.wrap{width:min(760px,100% - 28px);margin:18px auto 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font:600 1rem/1 var(--f-body);padding:13px 18px;min-height:46px;border-radius:999px;text-decoration:none;background:var(--turmeric);color:#2b1119}
.btn.pri{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:9px 14px;min-height:40px;font-size:.95rem}
.btn[disabled]{opacity:.55;cursor:wait}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin:0 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
.row{margin-bottom:14px}
h2{font-family:var(--f-ta);font-size:1.3rem;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:0;cursor:pointer;font:600 .95rem var(--f-body);padding:9px 14px;border-radius:999px;background:var(--band);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--kumkum);color:#fff3ea}
.o .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.o b{font-size:1.1rem}
.badge{font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--band);white-space:nowrap}
.st-NEW .badge{background:var(--turmeric);color:#2b1119}
.st-CONFIRMED .badge{background:var(--leaf);color:#fff}
.st-DELIVERED .badge{background:var(--ok);color:#fff}
.st-CANCELLED .badge{background:var(--bad);color:#fff}
.o p{margin:4px 0;color:var(--muted)}
.o p strong{color:var(--ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.msg{color:var(--muted);text-align:center;padding:24px 0}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
.thumb{width:100%;max-height:300px;object-fit:contain;border-radius:14px;background:var(--band);margin-bottom:12px}
.g{display:flex;gap:12px;align-items:center}
.g img{width:64px;height:84px;object-fit:cover;border-radius:10px;background:var(--band)}
.g div{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--kumkum);color:#fff3ea;padding:12px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="hd">
  <b>மங்கை மலரகம்</b><span>உரிமையாளர் பக்கம்</span>
  <button class="btn sm ghost" id="logout" hidden style="color:#fff3ea">வெளியேறு</button>
</header>

<main class="wrap">
  <section id="login" class="card">
    <h2>PIN உள்ளிடுங்கள்</h2>
    <form id="loginForm">
      <div class="row"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></div>
      <div class="row"><label style="display:flex;gap:10px;align-items:center;font-weight:500"><input id="remember" type="checkbox" style="width:20px;height:20px;min-height:0"> இந்த போனில் நினைவில் வை</label></div>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn pri" type="submit" id="loginBtn">உள்ளே போ</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="tabs" role="tablist">
      <button class="btn sm ghost" role="tab" data-tab="orders" aria-selected="true">ஆர்டர்கள்</button>
      <button class="btn sm ghost" role="tab" data-tab="add" aria-selected="false">புதிய மாலை</button>
      <button class="btn sm ghost" role="tab" data-tab="manage" aria-selected="false">என் படங்கள்</button>
    </div>

    <div id="tab-orders">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px">
        <h2 style="margin:0">ஆர்டர்கள்</h2>
        <button class="btn sm ghost" id="refresh">புதுப்பி</button>
      </div>
      <div class="chips" id="chips"></div>
      <div id="orders"></div>
    </div>

    <div id="tab-add" hidden>
      <div class="card">
        <h2>புதிய மாலை படம் சேர்</h2>
        <p class="msg" style="padding:0 0 14px;text-align:left">சேர்த்தவுடன் வாடிக்கையாளர் website-ல் தெரியும்.</p>
        <form id="addForm">
          <div class="row"><label for="file">படம்</label><input id="file" type="file" accept="image/*"></div>
          <img class="thumb" id="preview" alt="" hidden>
          <div class="row"><label for="ta">மாலை பெயர் (தமிழ்) *</label><input id="ta" maxlength="80" placeholder="எ.கா: மல்லி + ரோஜா மாலை"></div>
          <div class="row"><label for="en">English பெயர் (விருப்பம்)</label><input id="en" maxlength="80" placeholder="Jasmine and rose"></div>
          <div class="row"><label for="gtype">வகை</label><select id="gtype"></select></div>
          <p class="err" id="addErr" role="alert"></p>
          <button class="btn pri" type="submit" id="addBtn">சேர்</button>
        </form>
      </div>
    </div>

    <div id="tab-manage" hidden>
      <h2>நான் சேர்த்த படங்கள்</h2>
      <div id="garlands"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== இங்கே Apps Script Web App URL (…/exec) paste பண்ணுங்க ===== */
const API = "https://script.google.com/macros/s/AKfycbyG9uc3_q_b-5Xc_46QV69iJEkY9gidoo5tyMRPzjYqx6lvRwD_TI46LrRCbxnqvXa3/exec";

const TYPES = {
  wedding:"மணமாலை", swami:"சுவாமி மாலை", jasmine:"மல்லி மாலை", rose:"ரோஜா மாலை", sampangi:"சம்பங்கி மாலை",
  mix:"வண்ணக் கலவை மாலை", vada:"வாடாமல்லி + சம்பங்கி", arugu:"அருகம்புல் மாலை", sarm:"மல்லிகைச் சரம் / கதம்பம்",
  loose:"உதிரிப்பூக்கள்", custom:"மற்றவை"
};
const STATUS_TA = {NEW:"புதிது", CONFIRMED:"உறுதி", DELIVERED:"முடிந்தது", CANCELLED:"ரத்து"};
const ERR_TA = {PIN:"PIN தவறு.", LOCKED:"அதிக தடவை தவறு. 10 நிமிடம் கழித்து முயற்சிக்கவும்.", NOTSET:"Code.gs-ல் PIN இன்னும் மாற்றவில்லை.", NAME:"மாலை பெயரை எழுதுங்கள்.", IMG:"படம் சரியில்லை அல்லது மிகப் பெரியது.", SERVER:"Server பிழை. மீண்டும் முயற்சிக்கவும்."};

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try{ return localStorage.getItem(k)||sessionStorage.getItem(k)||""; }catch(_){ return ""; } },
  set(k,v,keep){ try{ (keep?localStorage:sessionStorage).setItem(k,v); }catch(_){} },
  del(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(_){} }
};
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2600); }

let PIN = "", ORDERS = [], FILTER = "new";

function call(body){
  if(!API) return Promise.reject(new Error("NOAPI"));
  return fetch(API,{method:"POST",body:JSON.stringify(Object.assign({pin:PIN},body))}).then(r=>r.json());
}
function errText(e){
  if(e && e.message==="NOAPI") return "API URL இன்னும் இந்த file-ல் போடவில்லை.";
  if(e && e.error) return ERR_TA[e.error] || ("பிழை: "+e.error);
  return "இணையம் / API சரிபார்க்கவும்.";
}

/* ---------- login ---------- */
$("#loginForm").addEventListener("submit", async ev=>{
  ev.preventDefault();
  PIN = $("#pin").value.trim();
  const btn=$("#loginBtn"), err=$("#loginErr"); err.textContent="";
  if(!PIN){ err.textContent="PIN எழுதுங்கள்."; return; }
  btn.disabled=true;
  try{
    const d = await call({action:"orders"});
    if(!d.ok){ err.textContent = errText(d); return; }
    store.set("mm_pin",PIN,$("#remember").checked);
    ORDERS = d.items; enter();
  }catch(e){ err.textContent = errText(e); }
  finally{ btn.disabled=false; }
});
$("#logout").addEventListener("click",()=>{ store.del("mm_pin"); location.reload(); });

function enter(){
  $("#login").hidden=true; $("#app").hidden=false; $("#logout").hidden=false;
  FILTER = ORDERS.some(o=>o.status==="NEW") ? "new" : "all";
  renderChips(); renderOrders();
}
(async function auto(){
  const p = store.get("mm_pin");
  if(!p || !API) return;
  PIN = p;
  try{ const d = await call({action:"orders"}); if(d.ok){ ORDERS=d.items; enter(); } else store.del("mm_pin"); }catch(_){}
})();

/* ---------- tabs ---------- */
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected", x===b));
  ["orders","add","manage"].forEach(t=>$("#tab-"+t).hidden = (t!==b.dataset.tab));
  if(b.dataset.tab==="manage") loadGarlands();
  if(b.dataset.tab==="orders") loadOrders();
}));

/* ---------- orders ---------- */
function todayStr(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function fmtDate(v){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v||""); return m?`${m[3]}-${m[2]}-${m[1]}`:(v||""); }
function matches(o,f){
  if(f==="all") return true;
  if(f==="today") return o.date===todayStr() && (o.status==="NEW"||o.status==="CONFIRMED");
  if(f==="new") return o.status==="NEW";
  if(f==="confirmed") return o.status==="CONFIRMED";
  if(f==="delivered") return o.status==="DELIVERED";
  return true;
}
const FILTERS=[["new","புதிது"],["today","இன்று தேவை"],["confirmed","உறுதி"],["delivered","முடிந்தது"],["all","அனைத்தும்"]];
function renderChips(){
  $("#chips").innerHTML = FILTERS.map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${FILTER===k}">${t} (${ORDERS.filter(o=>matches(o,k)).length})</button>`).join("");
}
$("#chips").addEventListener("click",e=>{ const b=e.target.closest("[data-f]"); if(!b) return; FILTER=b.dataset.f; renderChips(); renderOrders(); });

function actionsFor(o){
  const b=(s,t,cls="")=>`<button class="btn sm ${cls}" data-st="${s}" data-id="${esc(o.id)}">${t}</button>`;
  if(o.status==="NEW") return b("CONFIRMED","உறுதி செய்","pri")+b("CANCELLED","ரத்து","ghost");
  if(o.status==="CONFIRMED") return b("DELIVERED","முடிந்தது","pri")+b("CANCELLED","ரத்து","ghost");
  return b("NEW","மீண்டும் திற","ghost");
}
function renderOrders(){
  const list = ORDERS.filter(o=>matches(o,FILTER));
  if(!list.length){ $("#orders").innerHTML='<p class="msg">இங்கே ஆர்டர் இல்லை.</p>'; return; }
  $("#orders").innerHTML = list.map(o=>{
    const num = String(o.phone).replace(/\D/g,"").slice(-10);
    return `<article class="card o st-${esc(o.status)}">
      <div class="top"><b>${esc(o.name)}</b><span class="badge">${STATUS_TA[o.status]||esc(o.status)}</span></div>
      <p><strong>${esc(o.type)}</strong> × ${esc(o.qty)}</p>
      <p>தேவை: <strong>${fmtDate(o.date)} ${esc(o.timeNeed)}</strong></p>
      <p>${esc(o.mode)}${o.addr?" – "+esc(o.addr):""}</p>
      ${o.note?`<p>குறிப்பு: ${esc(o.note)}</p>`:""}
      <p style="font-size:.85rem">ஆர்டர் ${esc(o.id)} · ${esc(o.time)}</p>
      <div class="acts">
        <a class="btn sm ghost" href="tel:+91${num}">அழை</a>
        <a class="btn sm ghost" href="https://wa.me/91${num}" target="_blank" rel="noopener">WhatsApp</a>
        ${actionsFor(o)}
      </div></article>`;
  }).join("");
}
$("#orders").addEventListener("click", async e=>{
  const b=e.target.closest("[data-st]"); if(!b) return;
  b.disabled=true;
  try{
    const d=await call({action:"setStatus",id:b.dataset.id,status:b.dataset.st});
    if(!d.ok) throw d;
    const o=ORDERS.find(x=>x.id===b.dataset.id); if(o) o.status=b.dataset.st;
    renderChips(); renderOrders(); toast("மாற்றப்பட்டது");
  }catch(err){ toast(errText(err)); b.disabled=false; }
});
async function loadOrders(){
  $("#refresh").disabled=true;
  try{ const d=await call({action:"orders"}); if(!d.ok) throw d; ORDERS=d.items; renderChips(); renderOrders(); }
  catch(e){ toast(errText(e)); }
  finally{ $("#refresh").disabled=false; }
}
$("#refresh").addEventListener("click",loadOrders);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !$("#app").hidden && !$("#tab-orders").hidden) loadOrders(); });

/* ---------- add garland ---------- */
$("#gtype").innerHTML = Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
$("#file").addEventListener("change",()=>{
  const f=$("#file").files[0], p=$("#preview");
  if(!f){ p.hidden=true; return; }
  p.src=URL.createObjectURL(f); p.hidden=false;
});
async function shrink(file,max=900){
  let src;
  try{ src = await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(_){
    src = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  }
  const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight, s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.82).split(",")[1];
}
$("#addForm").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const err=$("#addErr"), btn=$("#addBtn"); err.textContent="";
  const f=$("#file").files[0], ta=$("#ta").value.trim();
  if(!f){ err.textContent="படத்தைத் தேர்ந்தெடுங்கள்."; return; }
  if(!ta){ err.textContent="மாலை பெயரை எழுதுங்கள்."; return; }
  btn.disabled=true; btn.textContent="சேர்க்கிறோம்…";
  try{
    const data=await shrink(f);
    const d=await call({action:"addGarland",ta,en:$("#en").value.trim(),type:$("#gtype").value,mime:"image/jpeg",data});
    if(!d.ok) throw d;
    toast("சேர்க்கப்பட்டது. Website-ல் தெரியும்.");
    $("#addForm").reset(); $("#preview").hidden=true;
  }catch(e){ err.textContent=errText(e); }
  finally{ btn.disabled=false; btn.textContent="சேர்"; }
});

/* ---------- manage garlands ---------- */
async function loadGarlands(){
  const box=$("#garlands"); box.innerHTML='<p class="msg">ஏற்றுகிறது…</p>';
  try{
    const d=await call({action:"garlands"}); if(!d.ok) throw d;
    if(!d.items.length){ box.innerHTML='<p class="msg">இன்னும் படம் சேர்க்கவில்லை.</p>'; return; }
    box.innerHTML=d.items.map(g=>`<div class="card g"><img src="${esc(g.img)}" alt=""><div><b>${esc(g.ta)}</b><p style="margin:2px 0;color:var(--muted)">${esc(TYPES[g.type]||"")}</p></div><button class="btn sm ghost" data-del="${esc(g.id)}">நீக்கு</button></div>`).join("");
  }catch(e){ box.innerHTML=`<p class="msg">${esc(errText(e))}</p>`; }
}
$("#garlands").addEventListener("click", async e=>{
  const b=e.target.closest("[data-del]"); if(!b) return;
  if(!confirm("இந்தப் படத்தை நீக்கவா?")) return;
  b.disabled=true;
  try{ const d=await call({action:"deleteGarland",id:b.dataset.del}); if(!d.ok) throw d; toast("நீக்கப்பட்டது"); loadGarlands(); }
  catch(err){ toast(errText(err)); b.disabled=false; }
});
</script>
</body>
</html>
